name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make tools
      - run: make lint

  e2e:
    runs-on: ubuntu-latest
    env:
      # Read access to the private wassie-dev/simpleOTA repository.
      SERVER_TOKEN: ${{ secrets.SIMPLEOTA_SERVER_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Skip without server access
        if: env.SERVER_TOKEN == ''
        run: echo "::notice::SIMPLEOTA_SERVER_READ_TOKEN is not set, so the e2e suite was skipped."
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: env.SERVER_TOKEN != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.SERVER_TOKEN != ''
        with:
          python-version: "3.12"
      - name: End-to-end tests against a local dev server
        if: env.SERVER_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${SERVER_TOKEN}@github.com/".insteadOf "https://github.com/"
          make e2e
      - name: Dev server log
        if: failure() && env.SERVER_TOKEN != ''
        run: cat .devserver/server.log
