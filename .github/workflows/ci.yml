name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      SIMPLEOTA_SERVER_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make tools
      - run: make lint

  install-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build release archives
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Test install.sh
        if: runner.os != 'Windows'
        run: scripts/test-install.sh
      - name: Test install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Test install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install.ps1

  e2e:
    runs-on: ubuntu-latest
    env:
      # The server commit the suite runs against, the one it was last checked
      # with. Move it forward deliberately.
      SIMPLEOTA_SERVER_REF: 00d169a019593591da439ef0924384f288fd9018
    steps:
      - name: Require server access
        env:
          # Read access to the private wassie-dev/simpleOTA repository.
          SERVER_TOKEN: ${{ secrets.SIMPLEOTA_SERVER_READ_TOKEN }}
        run: |
          if [ -z "$SERVER_TOKEN" ]; then
            echo "::error::SIMPLEOTA_SERVER_READ_TOKEN is not set, so the e2e suite cannot run."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: End-to-end tests against a local dev server
        env:
          # Only this step, and only clones of the server repository, use the
          # token. Nothing is written to the runner's git config.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SIMPLEOTA_SERVER_READ_TOKEN }}@github.com/wassie-dev/simpleOTA.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/wassie-dev/simpleOTA
        run: make e2e
      - name: Dev server log
        if: failure() && hashFiles('.devserver/server.log') != ''
        run: cat .devserver/server.log
