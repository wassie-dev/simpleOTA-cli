name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make tools
      - run: make lint

  e2e:
    runs-on: ubuntu-latest
    env:
      # Read access to the private wassie-dev/simpleOTA repository.
      SERVER_TOKEN: ${{ secrets.SIMPLEOTA_SERVER_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skip without server access
        if: env.SERVER_TOKEN == ''
        run: echo "::notice::SIMPLEOTA_SERVER_READ_TOKEN is not set, so the e2e suite was skipped."
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: env.SERVER_TOKEN != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.SERVER_TOKEN != ''
        with:
          python-version: "3.12"
      - name: End-to-end tests against a local dev server
        if: env.SERVER_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${SERVER_TOKEN}@github.com/".insteadOf "https://github.com/"
          make e2e
      - name: Dev server log
        if: failure() && env.SERVER_TOKEN != ''
        run: cat .devserver/server.log
