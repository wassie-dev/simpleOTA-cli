version: 2

project_name: simpleota

builds:
  - main: ./cmd/simpleota
    binary: simpleota
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/wassie-dev/simpleOTA-cli/internal/version.Version={{.Version}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1

release:
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1

changelog:
  use: github
